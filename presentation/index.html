/* ---------- device ---------- */
#device{position:absolute;left:958px;top:132px;width:464px;height:896px}

#navbar{position:absolute;left:52px;top:760px;width:360px;height:62px;border-radius:14px;background:#141416;box-shadow:inset 0 0 0 1px #2c2c30;display:flex;align-items:center;justify-content:space-around}

/* ---------- mobile caption ---------- */

}

.slider.hl::after{border-radius:32px}
.slider.shine.hl::after{display:none}.camview.shine{outline:3px solid #f29104;outline-offset:0;box-shadow:0 0 12px -2px rgba(239,192,0,.75);animation:camShine 1.6s ease-in-out infinite}.camview.shine.hl::after{display:none}@keyframes camShine{50%{outline-color:#f7b955;box-shadow:0 0 8px -2px rgba(239,192,0,.45)}}

function stateFor(n){
  const s = fresh(); S = s; s.step = n;
  if(n>=4){ s.screen='picking'; s.t0 = Date.now() - (n-3)*47000; }
  if(n>=6){ const b=L('beef'); b.picked=1; b.status='picked'; }
  if(n>=7){ const c=L('capsicum'); c.picked=c.qty; c.status='picked'; }
  if(n>=9){ const w=L('wipes'); w.picked=1; splitRemove(w,1); }
  if(n>=11){ applySubs(L('onion'),{A:2,B:0,C:0,D:0}); const sb=S.lines.find(l=>l.isSub); sb.picked=sb.qty; sb.status='picked'; }
  if(n>=12){ ['sensodyne','pringles','milk'].forEach(id=>{const l=L(id);l.picked=l.qty;l.status='picked'}); s.screen='orders'; s.elapsed=12*60000+2000; s.sheet={type:'ready'}; }
  switch(n){
    case 1: s.hl='sso'; break;
    case 2: s.screen='orders'; s.hl='order1'; break;
    case 3: s.screen='orders'; s.hl='swipe1'; break;
    case 4: s.hl='camsw'; break;
    case 5: s.hl='camsw'; break;
    case 6: s.cam=true; s.hl='viewfinder'; break;
    case 7: s.cam=true; s.hl='viewfinder'; break;
    case 8: s.cam=true; s.hl='viewfinder'; break;
    case 9: s.hl='cancel-onion'; break;
    case 10: s.sheet={type:'subs', id:'onion', q:{A:0,B:0,C:0}}; s.hl='add-A'; break;
    case 11: s.hl='fill'; break;
    case 12: s.hl='done'; break;
  }

}

let AC=null, soundOn=true;

function tone(freq, start, dur, type='square', vol=.12){
  const a=ac(); if(!a||!soundOn) return;
  const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.value=freq;
  const t=a.currentTime+start; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.005); g.gain.setValueAtTime(vol,t+dur-.01); g.gain.linearRampToValueAtTime(0,t+dur);

}

let completeBuf=null;
async function playComplete(){
  const a=ac(); if(!a||!soundOn) return;
  try{
    if(!completeBuf){ const bin=atob(SFX_COMPLETE_B64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
      completeBuf = await new Promise((res,rej)=>a.decodeAudioData(u.buffer,res,rej)); }
    const s=a.createBufferSource(); s.buffer=completeBuf; s.connect(a.destination); s.start();
  }catch(e){ beepOK(); }
}

function crumbs(c){ return c.map((x,i)=>(i?I.chev:'')+`<span>${x}</span>`).join(''); }
function bcs(l){ return `<div class="bcs">${l.bcs.map(b=>`<span class="bc">${I.bar}${b}</span>`).join('')}</div>`; }
function kvs(l, mat){ return `<div class="pkv"><div class="kv u"><span class="muted">Unit</span><b>${l.unit}</b></div><div class="kv"><span class="muted">Material</span><b>${mat||l.mat}</b></div><div class="kv"><span class="muted">Bin Location</span><b>${l.bin}</b></div></div>`; }
// tab badges count units (quantities), not lines
function counts(){ const c={todo:0,picked:0,oos:0,removed:0};
  S.lines.forEach(l=>{
    if(l.status==='todo'){ c.todo+=l.qty-l.picked; c.picked+=l.picked; }
    else if(l.status==='picked') c.picked+=l.picked;
    else if(l.status==='oos') c.oos+=l.qty;
    else if(l.status==='removed') c.removed+=(l.removedQty||l.qty);
  }); return c; }
function doneCount(){ return S.lines.reduce((a,l)=>a+(l.isSub ? 0 : l.status==='removed' ? (l.removedQty||l.qty) : l.status==='oos' ? Math.min(l.qty, subLines(l).reduce((t,x)=>t+x.picked,0)) : l.picked),0); }
function totalUnits(){ return unitsOf(S.cur||0); }
function fmt(ms){ const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }

  const k = 'order'+(i+1);
  return `<div class="ocard${hl(k)}" data-a="${k}" data-oi="${i}"><div class="in">
    <div class="orow"><span class="cap11" style="display:flex;gap:2px;align-items:center"><span class="muted">Order</span> <b class="semi">#${o.no}</b>${I.copy}</span><span class="cap11 semi" style="color:${o.agoColor}">${o.ago}</span></div>
    <div class="thumbs">${o.imgs.map(s=>`<img src="${s}" alt="">`).join('')}</div>
    <div class="kv3"><div class="kv"><span class="muted">Consignment</span><b>123123213</b></div><div class="kv"><span class="muted">Slot</span><b>13:15–13:30</b></div><div class="kv"><span class="muted">Qty</span><b>${o.qty}</b></div></div>
    <div class="slider${i===nextOrder()?' shine':''}${hl('swipe'+(i+1))}" data-slider="${i}"><div class="fill"></div><div class="knob">${I.dbl}</div><div class="lbl">Swipe to Start Picking</div></div>
  </div>
  <div class="ofoot"><span class="chip ${o.subs?'ok':'no'}" style="padding:4px 6px">${o.subs?I.check12:I.x12} Substitution ${o.subs?'OK':'NO'}</span><span class="cap11"><span class="muted">Date Ordered</span> <b class="semi">23/09/2025 12:17</b></span></div></div>`;
}

function renderDetail(){
  const d=S.detail, o=ordersData()[d.i], items=orderItems(d.i), units=items.reduce((a,x)=>a+x.q,0);
  return `<div class="app" style="background:#f2f2f7">
    <div class="ttb picking">${SB()}
      <div class="ph" style="gap:6px;padding-left:8px"><button class="backbtn" data-a="detail-back" aria-label="Back">${I.back}</button>
        <div style="flex:1;display:flex;flex-direction:column;gap:3px;min-width:0">
          <div style="display:flex;gap:6px;align-items:center"><span style="font-size:17px;font-weight:600;letter-spacing:-.3px">Order Detail</span><span class="chip ${o.subs?'ok':'no'}">${o.subs?I.check12:I.x12}Subs ${o.subs?'OK':'NO'}</span></div>
          <span class="cap11"><span class="muted">Order</span> <b class="semi">#${o.no}</b> · ${units} items</span></div>
        <span class="cap11 semi" style="color:${d.ready?'#008522':o.agoColor};align-self:flex-start;margin-top:4px">${d.ready?'Ready':o.ago}</span></div>
    </div>
    <div class="body" style="top:${S.screen==='detail'&&document.body.classList.contains('solo')?58:82}px;padding-bottom:${d.ready?16:86}px">
      <div class="dkv"><div class="kv"><span class="muted">Consignment</span><b>123123213</b></div><div class="kv"><span class="muted">Slot</span><b>13:15–13:30</b></div><div class="kv"><span class="muted">Date Ordered</span><b>23/09/2025 12:17</b></div></div>
      <div class="ditems"><div class="cap11 muted" style="padding:4px 4px 2px"><b class="semi" style="color:#161616">${items.length}</b> Items</div>
        ${items.map(x=>`<div class="ditem"><div class="dthumb">${x.thumb}${x.badge?`<span class="qbadge">x${x.q}</span>`:''}</div>
          <div style="flex:1;min-width:0"><div class="dname">${x.name}</div>
          ${kvs({unit:x.unit,bin:x.bin},x.mat).replace('class="pkv"','class="pkv dkvs"')}${x.cut?`<div class="cut" style="margin-top:6px"><span class="muted">Cutting</span> <b class="semi">${x.cut}</b></div>`:''}</div></div>`).join('')}
      </div>
    </div>
    ${d.ready?'':`<div class="dfoot"><div class="slider${d.i===nextOrder()?' shine':''}${hl('swipe'+(d.i+1))}" data-slider="${d.i}"><div class="fill"></div><div class="knob">${I.dbl}</div><div class="lbl">Swipe to Start Picking</div></div></div>`}
  </div>`;

function lineCard(l, view){
  view = view || l.status;
  const isTodo = view==='todo';
  const ringCol = l.status==='oos' ? '#f29104' : l.status==='removed' ? '#ff3b30' : '#008522';
  let right='';
  if(isTodo) right = curOrder().subs
    ? `<button class="cbtn${hl('cancel-'+l.id)}" data-a="cancel" data-id="${l.id}">${I.forbid}<span>Cancel Item</span></button>`
    : `<button class="cbtn rm${hl('cancel-'+l.id)}" data-a="cancel" data-id="${l.id}">${I.forbid.replace('#a25f00','#ff3b30')}<span>Remove Item</span></button>`;
  else if(view==='removed') right = `<button class="undo" data-a="undo" data-id="${l.id}">Undo Removal</button>`;
  else if(view==='picked') right = `<button class="undo" data-a="undo-picked" data-id="${l.id}">Undo Picked</button>`;
  else if(view==='oos') right = `<button class="undo" data-a="undo-sub" data-id="${l.id}">Undo Substitution</button>`;
  let extra='';
  if(l.cut && isTodo) extra = `<div class="cut"><span class="muted">Cutting</span> <b class="semi">${l.cut}</b></div>`;
  let subBlock='';
  if(l.status==='oos' && subLines(l).length) subBlock = `<div class="subbox"><div class="subhead"><span>Substituted with</span><button class="editbtn" data-a="resub" data-id="${l.id}">${I.pencil}Edit</button></div>${subLines(l).filter(x=>x.status!=='removed'&&x.status!=='merged').map(x=>`<div class="subitem"><img src="${x.big||x.img}" alt=""><div class="si"><div class="sn">${x.name}</div><div class="skv"><div><span>Material</span><b>${x.mat}</b></div><div><span>Bin Location</span><b>${x.bin}</b></div></div></div>${ring(x.picked,x.qty,'#008522')}</div>`).join('')}</div>`;
  else if(l.sub) subBlock = `<div class="subsel"><img src="${l.big||l.img}" alt=""><div style="flex:1;min-width:0"><div class="cap11 semi" style="color:#d77e00">Selected Subtitute</div><div style="font-size:13px;font-weight:600;margin:2px 0">${l.sub.name}</div><div style="font-size:10px" class="muted">Material <b style="color:#161616">[000000]</b> · Bin Location <b style="color:#161616">A819</b></div></div><button class="pencil" data-a="resub" data-id="${l.id}" aria-label="Change substitute">${I.pencil}</button></div>`;
  const showBcs = !l.sub;
  return `<div class="pc${hl('line-'+l.id)}${S.flashId===l.id?' flash':''}${S.focusId===l.id?' focus':''}" data-a="line" data-id="${l.id}" id="card-${l.id}">
    <div class="pcin${l.isSub?' issub':''}">
    <div class="crumb">${crumbs(l.cat)}</div>
    <div class="pin">
      ${S.expanded===l.id?`<div class="pbig"><div class="zoomwrap" data-zid="${l.id}">${l.big||l.img?`<img src="${l.big||l.img}" alt="" draggable="false">`:thumb(l)}</div><button class="collapse" data-a="enlarge" data-id="${l.id}" aria-label="Collapse image">${I.shrink}</button></div>`:''}
      <div class="ptop">${S.expanded===l.id?'':`<div class="pimg" data-a="enlarge" data-id="${l.id}">${thumb(l)}</div>`}
        <div class="pdet"><div class="pname"><p>${l.name}</p>${isTodo && l.status==='todo' ? `<div class="cstep"><button class="sbtn${hl('c-minus-'+l.id)}" data-a="c-minus" data-id="${l.id}" aria-label="One less" ${l.picked<=0?'disabled':''}>${I.minus}</button>${ring(l.picked,l.qty,'#008522')}<button class="sbtn${hl('c-plus-'+l.id)}" data-a="c-plus" data-id="${l.id}" aria-label="One more" ${l.picked<1||l.picked>=l.qty?'disabled':''}>${I.plus}</button></div>` : l.status==='removed' ? ring(l.removedQty||l.qty, l.origQty||l.qty, ringCol) : ring(l.status==='oos'?l.qty:l.sub?l.sub.qty:l.picked, l.status==='todo'?l.qty:(l.origQty||l.qty), ringCol)}</div>${l.status==='removed'?`<span class="cap11 semi" style="color:var(--sysred)">${l.removedQty||l.qty} removed</span>`:''}${showBcs?bcs(l):''}</div></div>
      <div class="prow"><div class="pinfo">${kvs(l)}${extra}</div>${right}</div>
      ${subBlock}
    </div>${l.isSub?`<div class="subfoot" data-a="goto-oos" data-id="${l.subFor}" role="button"><img src="${(L(l.subFor)||{}).plain||(L(l.subFor)||{}).img||l.img}" alt=""><span><b>Substitute for</b> ${l.forName}</span></div>`:''}</div></div>`;
}

      <button class="${S.tab==='picked'?'on':''}" data-a="tab" data-t="picked">Picked <span style="color:var(--green)">${c.picked}</span></button>
      <button class="${S.tab==='oos'?'on':''}" data-a="tab" data-t="oos">Out of Stock <span style="color:var(--orange)">${c.oos}</span></button>
      <button class="${S.tab==='removed'?'on':''}" data-a="tab" data-t="removed">Removed <span style="color:var(--sysred)">${c.removed}</span></button>
    </div></div>
  </div>`;
}

/* sheets */
function stepperHTML(p,q,minusKey,plusKey,minusDis,plusDis,ringColor){
  return `<div class="stepper"><button class="sbtn${hl(minusKey)}" data-a="${minusKey}" ${minusDis?'disabled':''}>${I.minus}</button>${ring(p,q,ringColor)}<button class="sbtn${hl(plusKey)}" data-a="${plusKey}" ${plusDis?'disabled':''}>${I.plus}</button></div>`;
}
function renderSheet(){
  const sh=S.sheet; if(!sh){ renderSheet.last=null; return ''; }
  let h='';
  if(sh.type==='item'){
    const l=L(sh.id);
    h = `<div class="big">${bigImg(l)}</div><h3>${l.name.replace('<br>',' ')}</h3>
      ${stepperHTML(l.picked,l.qty,'item-minus','item-plus',l.picked<=0,l.picked>=l.qty)}
      <div style="width:100%;overflow:hidden">${bcs(l)}</div>
      <div style="width:100%">${kvs(l)}</div>
      ${l.cut?`<div class="cut" style="width:100%"><span class="muted">Cutting</span> <b class="semi">${l.cut}</b></div>`:''}
      <div class="actions"><button class="abtn ghost${hl('sheet-back')}" data-a="sheet-back">Go back</button>${curOrder().subs?`<button class="abtn cancel${hl('sheet-cancel')}" data-a="sheet-cancel">${I.forbid16} Cancel Item</button>`:`<button class="abtn pink" data-a="sheet-cancel">Remove item</button>`}</div>`;
  }
  else if(sh.type==='cancel'){
    const l=L(sh.id);
    h = `<div class="shead"><p>Cancel Item</p><button data-a="close-sheet" aria-label="Close">${I.close}</button></div>
      <div style="width:100%;display:flex;gap:10px;align-items:center"><div class="pimg">${thumb(l)}</div><div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:600;line-height:17px;margin-bottom:6px">${l.name}</div>${bcs({bcs:[l.bcs[0]]})}</div>${ring(l.picked,l.qty)}</div>
      <div style="width:100%" class="cap11 muted">Selected Substitute</div>
      <div class="field">No substitute available</div>
      <div class="actions"><button class="abtn pink${hl('remove')}" data-a="remove">Remove item</button><button class="abtn" disabled>Use subtitute</button></div>`;
  }
  else if(sh.type==='confirmRemove'){
    const l=L(sh.id);
    h = `<div class="big">${bigImg(l)}</div><h3>${l.name}</h3>
      <div style="font-size:13px;line-height:16px;font-weight:600;color:var(--grey);text-align:center;margin-bottom:-4px">How many do you want to remove?</div>
      ${stepperHTML(sh.q,l.qty,'cr-minus','cr-plus',sh.q<=1,sh.q>=l.qty)}
      <div class="actions"><button class="abtn ghost${hl('cr-back')}" style="flex:0 0 86px" data-a="cr-back">Go back</button><button class="abtn red2${hl('cr-yes')}" data-a="cr-yes" ${sh.q<1?'disabled':''}>Yes, remove ${sh.q}</button></div>`;
  }
  else if(sh.type==='subs'){
    const l=L(sh.id), tot=Object.values(sh.q).reduce((a,b)=>a+b,0), room=subRoom(l);
    h = `<div class="shead"><p>Select substitute</p><button data-a="close-sheet" aria-label="Close">${I.close}</button></div>
      <div style="width:100%;display:flex;gap:10px;align-items:center"><div class="pimg">${thumb(l)}</div><div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:600;line-height:17px;margin-bottom:6px">${l.name}</div>${bcs({bcs:[l.bcs[0]]})}</div>${ring(tot,room)}</div>
      <div style="width:100%" class="cap11 muted">Selected Substitute</div>
      <div class="subscroll">${SUBS.map(s=>{const q=sh.q[s.id]||0;return `<div class="subcard${q?' sel':''}">
        <div class="simg"><img src="${l.big||l.img}" alt="">
          ${q? `<div class="mini sm"><button class="${hl('sub-minus-'+s.id).trim()}" data-a="sub-minus" data-s="${s.id}">${I.minus14}</button><span>${q}</span><button class="${hl('add-'+s.id).trim()}" data-a="sub-add" data-s="${s.id}" ${tot>=room?'disabled style="opacity:.5"':''}>${I.plus14}</button></div>`
               : `<button class="addc${hl('add-'+s.id)}" data-a="sub-add" data-s="${s.id}" ${tot>=room?'disabled style="opacity:.4"':''}>${I.plus14}</button>`}</div>
        <div class="n">${s.name}</div>
        <div class="kvl"><span>Material</span><b>364608</b></div>
        <div class="kvl"><span>Bin Location</span><b>A819</b></div></div>`}).join('')}</div>
      <div class="actions"><button class="abtn pink" data-a="remove">Remove item</button><button class="abtn red${hl('use-sub')}" data-a="use-sub" ${tot<1?'disabled':''}>Use subtitute</button></div>`;
  }
  else if(sh.type==='subDetail'){
    const l=L(sh.id);
    h = `<div class="big">${bigImg(l)}</div><h3>${(SUBS.find(x=>x.id===sh.sub)||SUBS[0]).name}</h3>
      ${stepperHTML(sh.q,sh.target||l.qty,'sd-minus','sd-plus',sh.q<=0,sh.q>=(sh.target||l.qty))}
      <div style="width:100%;display:flex;justify-content:center">${bcs({bcs:['6291100100149']})}</div>
      <div style="width:100%">${kvs(l,'[000000]')}</div>
      <div class="actions"><button class="abtn ghost${hl('sd-close')}" data-a="sd-close">Close</button><button class="abtn cancel" data-a="close-sheet">${I.forbid16} Cancel Item</button></div>`;
  }
  else if(sh.type==='ready'){
    const c=counts();
    const fast=S.elapsed<=90000;
    h = `<div class="ready" style="display:contents"><div class="ok ${fast?'fast':'steady'}">${fast?I.rocket:I.thumb}${fast?'<i></i><i></i><i></i><i></i><i></i><i></i>':''}</div>
      <h3 class="rtitle">${fast?'That was quick! Keep going':'Nice work. Let’s go a little faster<br>on the next one.'}</h3>
      <p style="font-size:13px;line-height:16px;text-align:center;color:var(--grey);margin-top:-8px">Order <b style="color:#161616">#${curOrder().no}</b> is now ready for shipment.<br>Fulfilment takes it from here.</p>
      <div class="rsum ${fast?'fast':'steady'}">
        <div class="rstats"><div class="kv"><span class="muted">Picked</span><b${fast?' style="color:var(--green)"':''}>${c.picked}</b></div><div class="kv"><span class="muted">Substituted</span><b style="color:var(--orange)">${c.oos}</b></div><div class="kv"><span class="muted">Removed</span><b style="color:var(--sysred)">${c.removed}</b></div></div>
        <div class="rtime"><span>${I.bolt2}Picking time</span><b>${Math.floor(S.elapsed/60000)}m ${Math.floor(S.elapsed/1000)%60}s</b></div>
      </div>
      <button class="cta${hl('done')}" data-a="done" style="margin-top:4px">Done</button></div>`;
  }
  const key = sh.type+':'+(sh.id||''); const na = key===renderSheet.last ? ' noanim' : ''; renderSheet.last = key;
  return `<div class="dim${na}" data-a="dim"></div><div class="sheet${na}">${h}</div>`;
}

/* steps panel */
const stepsEl = document.getElementById('steps'), mcap=document.getElementById('mcap');
function renderSteps(){
  let h='';
  STEPS.forEach((s,i)=>{ const n=i+1;
    if(s.sec) h+=`<div class="sec">${s.sec}</div>`;
    const cls = S.finished? 'done' : n===S.step?'active': n<S.step?'done':'';
    h+=`<button class="step ${cls}" data-step="${n}"><span class="num">${n}</span><span style="flex:1"><div class="t">${s.t}</div><div class="d">${s.d}</div></span></button>`;
  });
  h+=`<div id="stepFoot">${S.finished?'<span style="color:#9bd49c;font-weight:600;font-size:14px;margin-right:auto;align-self:center">✓ Order picked end to end</span>':''}<button data-nav="prev">← Previous</button><button data-nav="next">Next →</button><button data-nav="restart">Restart</button></div>`;
  stepsEl.innerHTML=h;
  const a=stepsEl.querySelector('.step.active');
  if(a && !S._noScroll && renderSteps.last!==S.step){ const r=a.offsetTop - stepsEl.clientHeight/2 + a.offsetHeight/2; stepsEl.scrollTo({top:r,behavior:'smooth'}); }
  renderSteps.last=S.step;
  const s=STEPS[S.step-1];
  mcap.innerHTML = `<div class="row"><span class="num">${S.finished?'✓':S.step}</span><div><div class="t">${S.finished?'Done: order picked end to end':s.t}</div><div class="d">${S.finished?'Restart to run the flow again, or jump to any step.':s.d}</div></div></div>
    <div class="nav"><button data-nav="prev">← Back</button><button data-nav="next">Next →</button><button data-nav="restart">↺</button></div>`;
}

function setStep(n){ S.step=n; }
function go(n){ n=Math.max(1,Math.min(12,n)); stateFor(n); S.keepScroll=false; render(); }

/* ======================= flows ======================= */
let toastT;
/* swipe the snackbar up to dismiss it */
let toastDrag=null;
function toastEl(){ return document.querySelector('.toast'); }
document.addEventListener('pointerdown',e=>{ const t=e.target.closest&&e.target.closest('.toast'); if(!t) return; e.preventDefault(); e.stopPropagation(); clearTimeout(toastT); toastDrag={y0:e.clientY,dy:0}; try{t.setPointerCapture(e.pointerId)}catch(_){} },true);
document.addEventListener('pointermove',e=>{ if(!toastDrag) return; const sc=parseFloat(document.getElementById('stage')?.style.getPropertyValue('--s'))||1; toastDrag.dy=Math.min(0,(e.clientY-toastDrag.y0)/sc); const t=toastEl(); if(t){ t.style.transition='none'; t.style.transform=`translateY(${toastDrag.dy}px)`; t.style.opacity=Math.max(.2,1+toastDrag.dy/80); } },true);
function toastRelease(){ if(!toastDrag) return; const d=toastDrag.dy; toastDrag=null; const t=toastEl();
  if(d<-24){ if(t){ t.style.transition='transform .18s ease, opacity .18s ease'; t.style.transform='translateY(-120px)'; t.style.opacity='0'; } setTimeout(()=>{ S.toast=null; render(); },170); }
  else { if(t){ t.style.transition='transform .18s ease, opacity .18s ease'; t.style.transform=''; t.style.opacity=''; } toastT=setTimeout(()=>{S.toast=null; render();},1400); } }
document.addEventListener('pointerup',toastRelease,true); document.addEventListener('pointercancel',toastRelease,true);
document.addEventListener('click',e=>{ if(e.target.closest&&e.target.closest('.toast')){ e.stopPropagation(); e.preventDefault(); } },true);
function toast(text, kind='ok', ms=1800){ S.toast={text,kind}; clearTimeout(toastT); toastT=setTimeout(()=>{S.toast=null; render();}, ms); }
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
const SCAN_DELAY=1500; // logo loader shown while a scan is validated
function pressKeys(){ document.querySelectorAll('.key.scan').forEach(k=>{ k.classList.remove('press'); void k.offsetWidth; k.classList.add('press'); setTimeout(()=>k.classList.remove('press'),450); }); }
async function scanSim(){ pressKeys(); S.scanning=true; S.scanT=Date.now(); S.busy=true; try{ render(); await wait(SCAN_DELAY); } finally { S.scanning=false; S.busy=false; try{ render(); }catch(e){} } }
// safety net: the scan loader can never stay up longer than a few seconds
setInterval(()=>{ if(S && S.scanning && Date.now()-(S.scanT||0)>4000){ S.scanning=false; S.busy=false; render(); } },1000);

async function act(a, el){
  if(S.busy) return;
  ac();
  const id = el && el.dataset.id;
  switch(a){
    case 'sso':
      if(S.loading) return; S.loading=true; render(); await wait(900); S.loading=false;
      S.screen='orders'; setStep(2); S.hl='order1'; S.keepScroll=false; render(); break;
    case 'support': toast('Not part of demo','info'); render(); break;
    case 'order1': case 'order2': case 'order3': {
      S.detail={i:+el.dataset.oi, ready:false}; S.screen='detail'; if(S.step===2){ setStep(3); S.hl='swipe1'; } tick(); S.keepScroll=false; render(); break; }
    case 'ready-detail': S.detail={i:+el.dataset.oi||0, ready:true}; S.screen='detail'; tick(); S.keepScroll=false; render(); break;
    case 'detail-back': S.screen='orders'; if(S.step===3) S.hl='swipe1'; tick(); S.keepScroll=false; render(); break;
    case 'otab': S.ordersTab=el.dataset.t; render(); break;
    case 'profile': toast('Profile isn’t part of this demo','ok'); render(); break;
    case 'nav-orders': if(S.screen==='profile'){ S.screen='orders'; tick(); S.keepScroll=false; render(); } break;
    case 'logout': go(1); toast('Signed out','info'); render(); break;
    case 'restart': go(1); break;
    case 'line': if(S.hl==='line-'+id){ setStep(5); S.hl='camsw'; tick(); render(); } break;
    case 'camsw':
      S.cam=!S.cam; tick();
      if(S.cam && S.step<=5){ if(S.step===4) setStep(5); S.hl='viewfinder'; }
      else if(S.cam && S.step===10) S.hl='viewfinder';
      else if(!S.cam && S.step===10) S.hl='camsw';
      else if(!S.cam && S.hl==='viewfinder') S.hl='camsw';
      render(); break;
    case 'viewfinder': await doScan(); break;
    case 'goto-oos': { const o=L(id); if(!o) break; S.tab=o.status==='oos'?'oos':o.status==='todo'?'todo':o.status; S.focusId=id; tick(); render();
      const cd=document.getElementById('card-'+id); if(cd) cd.scrollIntoView({block:'center',behavior:'smooth'});
      clearTimeout(S.focusT); S.focusT=setTimeout(()=>{ S.focusId=null; render(); },2400); break; }
    case 'c-plus': { const l=L(id); if(l.status==='todo' && l.picked>=1 && l.picked<l.qty){ l.picked++; beepOK(); buzz('ok'); markPicked(l); stepAfterPick(l,false); render(); } break; }
    case 'c-minus': { const l=L(id); if(l.picked>0){ l.picked--; if(l.status==='picked') l.status='todo'; tick(); toast(`${l.picked}/${l.qty} · ${l.name.replace('<br>',' ')}`,'info'); render(); } break; }
    case 'item-plus': { const l=L(S.sheet.id); if(l.picked<l.qty){ l.picked++; beepOK(); markPicked(l); render(); } break; }
    case 'item-minus': { const l=L(S.sheet.id); if(l.picked>0){ l.picked--; if(l.status==='picked') l.status='todo'; tick(); render(); } break; }
    case 'sheet-back': {
      const l=L(S.sheet.id); S.sheet=null;
      if(l.status==='picked' && S.step===6){ setStep(7); S.hl='viewfinder'; S.cam=true; }
      render(); break; }
    case 'sheet-cancel': { const l=L(S.sheet.id); S.sheet= curOrder().subs ? {type:'cancel', id:l.id} : {type:'confirmRemove', id:l.id, q:1}; if(S.step===8) S.hl='remove'; tick(); render(); break; }
    case 'cancel': {
      const l=L(id); tick();
      if(l.isSub) S.sheet={type:'confirmRemove', id, q:1};
      else if((S.cur||0)===0 && (id==='onion' || S.step===9)){ S.sheet={type:'subs', id, q:{A:0,B:0,C:0}}; if(S.step===9){ setStep(10); S.hl='add-A'; } }
      else if((S.cur||0)>0 && curOrder().subs) S.sheet={type:'subs', id, q:{A:0,B:0,C:0}};
      else if(!curOrder().subs) S.sheet={type:'confirmRemove', id, q:1};
      else S.sheet={type:'cancel', id};
      if(S.step===8 && S.sheet.type==='cancel') S.hl='remove';
      render(); break; }
    case 'remove': { const sid=S.sheet.id; S.sheet={type:'confirmRemove', id:sid, q:1}; if(S.step===8) S.hl='cr-yes'; tick(); render(); break; }
    case 'cr-plus': { const l=L(S.sheet.id); if(S.sheet.q<l.qty){ S.sheet.q++; tick(); render(); } break; }
    case 'cr-minus': if(S.sheet.q>1){ S.sheet.q--; tick(); render(); } break;
    case 'cr-back': S.sheet=null; render(); break;
    case 'cr-yes': {
      const l=L(S.sheet.id), q=S.sheet.q; const kept=splitRemove(l,q); S.sheet=null; S.cam=false;
      if(l.isSub) returnToPick(L(l.subFor), q);
      S.tab='todo';
      if(kept){ S.flashId=l.id; setTimeout(()=>{S.flashId=null},900); toast(`${q} removed · ${kept} kept${l.status==='picked'?' as picked':' to pick'}`); }
      else toast('Item successfully removed');
      beepOK();
      if(S.step===8){ setStep(9); S.hl = S.tab==='todo' ? 'cancel-onion' : 'tab-todo'; }
      S.keepScroll=false; render(); break; }
    case 'undo': { const l=L(id);
      if(l.isSub) takeFromPick(l.subFor, l.removedQty||l.qty);
      if(l.parent){ const p=L(l.parent); p.qty+=l.removedQty; p.status = p.picked>=p.qty?'picked':'todo'; S.lines.splice(S.lines.indexOf(l),1); }
      else { l.status='todo'; l.picked=0; l.qty=l.origQty||l.qty; l.removedQty=0; }
      tick(); toast('Removal undone'); render(); break; }
    case 'tab': S.expanded=null; S.tab=el.dataset.t; tick(); if(S.hl==='tab-todo' && S.tab==='todo') S.hl='cancel-onion'; S.keepScroll=false; render(); break;
    case 'sub-add': { const s=el.dataset.s, l=L(S.sheet.id); const tot=Object.values(S.sheet.q).reduce((a,b)=>a+b,0); if(tot>=subRoom(l)) return;
      S.sheet.q[s]=(S.sheet.q[s]||0)+1; tick(); if(S.step===10){ S.hl = tot+1>=l.qty ? 'use-sub' : 'add-'+s; } render(); break; }
    case 'sub-minus': { const s=el.dataset.s; if(S.sheet.q[s]>0){ S.sheet.q[s]--; tick(); if(S.step===10) S.hl='add-A'; render(); } break; }
    case 'use-sub': { const l0=L(S.sheet.id), tot0=applySubs(l0,S.sheet.q); if(tot0<1) break;
      S.sheet=null; S.tab='todo'; S.keepScroll=false; if(S.step===10) S.hl = S.cam?'viewfinder':'camsw'; else S.hl=null;
      tick(); toast(`${tot0} out of stock · substitute added to To Pick`,'info'); render(); break; }
    case 'use-sub-old': { const sid=S.sheet.id; const tot=Object.values(S.sheet.q).reduce((a,b)=>a+b,0); if(tot<1) return; const pick=SUBS.find(x=>(S.sheet.q[x.id]||0)>0)||SUBS[0]; S.sheet={type:'subDetail', id:sid, q:0, sub:pick.id, target:tot}; if(S.step===10) S.hl='sd-plus'; tick(); render(); break; }
    case 'sd-plus': {
      const l=L(S.sheet.id), tg=S.sheet.target||l.qty; if(S.sheet.q>=tg) return;
      if(S.sheet.q===0){ await scanSim(); S.sheet.q=1; beepOK(); toast(`Picked 1/${tg} · ${(SUBS.find(x=>x.id===S.sheet.sub)||SUBS[0]).name}`); }
      else { S.sheet.q++; tick(); toast('Item quantity added manually'); }
      if(S.step===10) S.hl = S.sheet.q>=tg ? 'sd-close' : 'sd-plus';
      render(); break; }
    case 'sd-minus': if(S.sheet.q>0){ S.sheet.q--; tick(); if(S.step===10) S.hl='sd-plus'; render(); } break;
    case 'sd-close': {
      const l=L(S.sheet.id);
      const tg=S.sheet.target||l.qty, ch=SUBS.find(x=>x.id===S.sheet.sub)||SUBS[0];
      if(S.sheet.q>=tg){
        if(tg<l.qty){ // partial substitution: split the substituted units into their own card
          const orig=l.origQty||l.qty, c={...l, id:l.id+'-sub'+(++subSeq), parent:l.id, qty:tg, origQty:orig, status:'oos', picked:tg, sub:{id:ch.id,name:ch.name,qty:tg}};
          l.origQty=orig; l.qty-=tg; l.picked=Math.min(l.picked,l.qty); l.status=l.picked>=l.qty?'picked':'todo';
          S.lines.splice(S.lines.indexOf(l)+1,0,c);
          toast(`Substitute picked · ${l.qty-l.picked} still to pick`);
        } else { l.status='oos'; l.sub={id:ch.id,name:ch.name,qty:S.sheet.q}; l.picked=S.sheet.q; toast('Substitute picked'); }
        if(S.step===10){ setStep(11); S.hl='fill'; } }
      S.sheet=null; S.keepScroll=false; render(); break; }
    case 'close-sheet': S.sheet=null; render(); break;
    case 'dim': if(S.sheet && S.sheet.type!=='ready'){ S.sheet=null; render(); } break;
    case 'enlarge': { S.expanded = S.expanded===id ? null : id; delete ZOOM[id]; tick(); render(); break; }
    case 'undo-picked': { const l=L(id); l.picked=0; if(l.status==='picked') l.status='todo'; tick(); toast(`Pick undone · ${l.name.replace('<br>',' ')}`,'info'); render(); break; }
    case 'undo-sub': { const l=L(id); subLines(l).forEach(x=>S.lines.splice(S.lines.indexOf(x),1));
      if(l.parent){ const p=L(l.parent); if(p){ p.qty+=l.qty; if(p.status==='merged'||p.status==='picked') p.status=p.picked>=p.qty?'picked':'todo'; S.lines.splice(S.lines.indexOf(l),1); tick(); toast(`Substitution undone · ${l.name.replace('<br>',' ')}`,'info'); render(); break; } }
      l.status='todo'; l.sub=null; l.picked=0; tick(); toast(`Substitution undone · ${l.name.replace('<br>',' ')}`,'info'); render(); break; }
    case 'resub': { const l=L(id); const q={A:0,B:0,C:0,D:0}; if(l.sub) q[l.sub.id]=l.sub.qty; subLines(l).forEach(x=>{ const k=(x.id.match(/-s([A-D])\d+$/)||[])[1]; if(k) q[k]+=x.qty; }); S.sheet={type:'subs', id, q, re:true}; tick(); render(); break; }
    case 'flash': S.flash=!S.flash; tick(); render(); break;
    case 'fill': await fillRest(); break;
    case 'done':
      S.sheet=null; if(!S.done.includes(S.cur||0)) S.done.push(S.cur||0); S.ordersDone=true; S.newCount=3-S.done.length; S.readyCount=S.done.length; S.finished=true; S.hl=null; S.ordersTab='new'; render(); break;
    case 'home': case 'back': break;
  }
}

function stepAfterPick(l, scanned){
  if(S.step<=5 && l.id==='beef'){ setStep(6); S.hl='viewfinder'; }
  else if(S.step===6 && l.id==='capsicum'){ if(l.picked>=l.qty){ setStep(7); S.hl='viewfinder'; } else S.hl='c-plus-'+l.id; }
  else if(S.step===8 && scanned){ S.hl='cancel-'+l.id; }
  else if(S.step===10 && l.isSub){ if(l.picked>=l.qty){ setStep(11); S.hl='fill'; } else S.hl='c-plus-'+l.id; }
  else if(scanned) S.hl=null;
}
function nextTarget(){
  if(S.step<=5 && L('beef').status==='todo') return L('beef');
  if(S.step===6 && L('capsicum') && L('capsicum').status==='todo') return L('capsicum');
  if(S.step===8 && L('wipes').status==='todo') return L('wipes');
  if(S.step===10){ const sb=S.lines.find(l=>l.isSub && l.status==='todo'); if(sb) return sb; }
  return S.lines.find(l=>l.status==='todo');
}

function markPicked(l){
  const nm=l.name.replace('<br>',' ');
  if(l.picked>=l.qty){ l.status='picked'; toast(`Picked · ${nm}`); }
  else toast(`Picked ${l.picked}/${l.qty} · ${nm}`);
}
async function doScan(){
  if(!S.cam) return;
  await scanSim();
  if(S.step===7){
    beepErr(); toast('Wrong item scanned','err',2000); S.busy=true; render();
    await wait(1700); S.busy=false; setStep(8); S.hl='viewfinder'; render(); return;
  }
  // which line to scan: step 5 → beef, step 8 → wipes, otherwise next todo line
  let target = nextTarget();
  if(!target){ beepErr(); toast('Nothing left to pick','err'); render(); return; }
  if(target.status!=='todo'){ beepErr(); toast('Item already picked','err'); render(); return; }
  target.picked = Math.min(target.qty, target.picked+1); beepOK(); buzz('ok'); markPicked(target);
  S.flashId=target.id; setTimeout(()=>{ if(S.flashId===target.id){ S.flashId=null; render(); } },900);
  stepAfterPick(target, true);
  render();
  const cd=document.getElementById('card-'+target.id); if(cd) cd.scrollIntoView({block:'nearest',behavior:'smooth'});
  maybeFinish();
}

function maybeFinish(){
  if(S.screen!=='picking' || S.busy || S.sheet || S.finishing) return;
  if(S.lines.some(l=>l.status==='todo')) return;
  S.finishing=true;
  setTimeout(()=>{ S.finishing=false; if(S.screen!=='picking'||S.sheet) return;
    S.elapsed = S.t0 ? Date.now()-S.t0 : 0; S.scanning=false; S.busy=false; S.screen='orders'; S.cam=false; setStep(12); S.sheet={type:'ready'}; S.hl='done'; playComplete(); buzz('ok'); S.keepScroll=false; render(); }, 900);
}
async function fillRest(){
  S.busy=true; S.hl=null; S.tab='todo'; S.cam=false; render();
  const todo = S.lines.filter(l=>l.status==='todo');
  for(const l of todo){
    const card=document.getElementById('card-'+l.id);
    if(card){ card.scrollIntoView({behavior:'smooth',block:'nearest'}); }
    await wait(260);
    for(let i=l.picked;i<l.qty;i++){ l.picked++; beepOK(); S.keepScroll=true; render(); await wait(240); }
    const c2=document.getElementById('card-'+l.id); if(c2) c2.classList.add('gone');
    await wait(260); l.status='picked'; render();
  }
  S.busy=false;
  S.elapsed = S.t0 ? Date.now()-S.t0 : 0;
  await wait(400);
  S.screen='orders'; S.cam=false; setStep(12); S.sheet={type:'ready'}; S.hl='done'; playComplete(); buzz('ok'); S.keepScroll=false; render();
}

function bindSliders(){
  screenEl.querySelectorAll('.slider').forEach(sl=>{
    const knob=sl.querySelector('.knob'), fill=sl.querySelector('.fill'), lbl=sl.querySelector('.lbl');
    let sx=null, max=0, scale=1, moved=false;
    const set=x=>{ knob.style.left=(4+x)+'px'; fill.style.width=(48+x)+'px'; lbl.style.opacity=1-x/max; };
    const finish=async ()=>{
      const i=+sl.dataset.slider;
      const next=[0,1,2].find(k=>!S.done.includes(k));
      if(i!==next){ set(0); toast('Claim the oldest slot first','err'); beepErr(); render(); return; }
      knob.style.transition=fill.style.transition='all .18s'; set(max); beepOK();
      await wait(350); S.cur=i; S.screen='picking'; S.t0=Date.now(); S.tab='todo'; S.cam=false; S.expanded=null;
      if(i===0){ setStep(4); S.hl='camsw'; }
      else { S.lines=ORDER_LINES[i].map(l=>({...l, picked:0, status:'todo', sub:null})); S.hl=null; }
      S.keepScroll=false; render();
    };
    sl.addEventListener('pointerdown',e=>{ if(S.busy) return; e.stopPropagation(); ac(); sx=e.clientX; moved=false; max=sl.clientWidth-48; scale=sl.getBoundingClientRect().width/sl.clientWidth; knob.style.transition=fill.style.transition='none'; sl.setPointerCapture(e.pointerId); });
    sl.addEventListener('pointermove',e=>{ if(sx===null) return; const dx=Math.max(0,Math.min(max,(e.clientX-sx)/scale)); if(dx>3) moved=true; set(dx); });
    const up=e=>{ if(sx===null) return; const dx=Math.max(0,(e.clientX-sx)/scale); sx=null;
      if(!moved){ // tap = auto swipe
        knob.style.transition=fill.style.transition='all .45s cubic-bezier(.3,.7,.2,1)'; finish(); return; }
      if(dx>max*0.7) finish(); else { knob.style.transition=fill.style.transition='all .2s'; set(0); } };
    sl.addEventListener('pointerup',up); sl.addEventListener('pointercancel',()=>{sx=null;set(0)});
    sl.addEventListener('click',e=>e.stopPropagation());
  });
}

const _sc=()=>parseFloat(document.getElementById('stage').style.getPropertyValue('--s'))||1;

/* ======================= enlarged image: pinch / wheel / double-tap zoom ======================= */
const ZOOM={};
function bindZoom(){
  screenEl.querySelectorAll('.zoomwrap').forEach(w=>{
    const id=w.dataset.zid, img=w.querySelector('img'); if(!img) return;
    const z=ZOOM[id]||(ZOOM[id]={s:1,x:0,y:0});
    const W=()=>w.offsetWidth, H=()=>w.offsetHeight;
    const k=()=>w.getBoundingClientRect().width/W();
    const local=(cx,cy)=>{const r=w.getBoundingClientRect();return [(cx-r.left)/k(),(cy-r.top)/k()];};
    const clamp=()=>{ z.s=Math.max(1,Math.min(4,z.s)); z.x=Math.min(0,Math.max(W()-W()*z.s,z.x)); z.y=Math.min(0,Math.max(H()-H()*z.s,z.y)); };
    const apply=(anim)=>{ clamp(); img.style.transition=anim?'transform .2s ease':'none'; img.style.transform=`translate(${z.x}px,${z.y}px) scale(${z.s})`; w.classList.toggle('zoomed',z.s>1.01); };
    const zoomAt=(px,py,ns)=>{ const r=ns/z.s; z.x=px-(px-z.x)*r; z.y=py-(py-z.y)*r; z.s=ns; };
    apply(false);
    let g=null, lastTap=0;
    w.addEventListener('touchstart',e=>{
      if(e.touches.length===2){
        const [a,b]=[e.touches[0],e.touches[1]];
        g={mode:'pinch',d0:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),s0:z.s,x0:z.x,y0:z.y,m:local((a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2)};
        e.stopPropagation(); if(e.cancelable) e.preventDefault();
      } else if(e.touches.length===1){
        const t=e.touches[0], now=Date.now();
        if(now-lastTap<300){ const [px,py]=local(t.clientX,t.clientY); zoomAt(px,py, z.s>1.01?1:2.5); apply(true); lastTap=0; e.stopPropagation(); if(e.cancelable) e.preventDefault(); return; }
        lastTap=now;
        if(z.s>1.01){ g={mode:'pan',p:[t.clientX,t.clientY],x0:z.x,y0:z.y}; e.stopPropagation(); }
      }
    },{passive:false});
    w.addEventListener('touchmove',e=>{
      if(!g) return; e.stopPropagation(); if(e.cancelable) e.preventDefault();
      if(g.mode==='pinch' && e.touches.length===2){
        const [a,b]=[e.touches[0],e.touches[1]];
        const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
        const m=local((a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2);
        const ns=Math.max(1,Math.min(4,g.s0*d/g.d0));
        z.s=g.s0; z.x=g.x0; z.y=g.y0; zoomAt(g.m[0],g.m[1],ns);
        z.x+=m[0]-g.m[0]; z.y+=m[1]-g.m[1]; apply(false);
      } else if(g.mode==='pan' && e.touches.length===1){
        const t=e.touches[0]; z.x=g.x0+(t.clientX-g.p[0])/k(); z.y=g.y0+(t.clientY-g.p[1])/k(); apply(false);
      }
    },{passive:false});
    w.addEventListener('touchend',e=>{ if(e.touches.length===0){ g=null; if(z.s<1.05){ z.s=1; apply(true);} } });
    // desktop: wheel to zoom, drag to pan, double-click to toggle
    w.addEventListener('wheel',e=>{ e.preventDefault(); e.stopPropagation(); const [px,py]=local(e.clientX,e.clientY); zoomAt(px,py, Math.max(1,Math.min(4, z.s*(e.deltaY<0?1.15:1/1.15)))); apply(false); },{passive:false});
    w.addEventListener('dblclick',e=>{ const [px,py]=local(e.clientX,e.clientY); zoomAt(px,py, z.s>1.01?1:2.5); apply(true); });
    w.addEventListener('mousedown',e=>{ if(z.s<=1.01) return; e.stopPropagation(); e.preventDefault(); const p0=[e.clientX,e.clientY], x0=z.x, y0=z.y;
      const mv=ev=>{ z.x=x0+(ev.clientX-p0[0])/k(); z.y=y0+(ev.clientY-p0[1])/k(); apply(false); };
      const up=()=>{ window.removeEventListener('mousemove',mv); window.removeEventListener('mouseup',up); };
      window.addEventListener('mousemove',mv); window.addEventListener('mouseup',up); });
  });
}

/* ======================= pull to refresh ======================= */
let ptr=null, ptrSuppress=false;
const PTR_SVG = `<svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5" fill="none" stroke="#d52a1e" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="34 13"/></svg>`;
function ptrStart(y,t){
  if(ptr||S.sheet||S.busy||S.scanning||t.closest('.slider')) return;
  const b=t.closest('.body'); if(!b||b.scrollTop>0) return;
  ptr={y0:y,b,d:0,el:null};
}
function ptrMove(y,e){
  if(!ptr) return;
  const raw=y-ptr.y0;
  if(raw<=0){ if(ptr.d>0){ ptr.b.style.transform=''; if(ptr.el){ptr.el.remove(); ptr.el=null;} ptr.d=0; } return; }
  if(ptr.b.scrollTop>0){ ptr=null; return; }
  if(e && e.cancelable) e.preventDefault();
  const d=Math.min(110, raw*0.5); ptr.d=d; if(raw>6) ptrSuppress=true;
  if(!ptr.el){ ptr.el=document.createElement('div'); ptr.el.className='ptr'; ptr.el.innerHTML=PTR_SVG; ptr.el.style.top=ptr.b.offsetTop+'px'; ptr.b.parentElement.appendChild(ptr.el); }
  ptr.b.style.transition='none'; ptr.b.style.transform=`translateY(${d}px)`;
  ptr.el.style.transform=`translateY(${d-40}px) rotate(${d*4}deg)`;
  ptr.el.firstChild.style.opacity = Math.min(1, d/60);
}
function ptrEnd(){
  if(!ptr) return; const p=ptr; ptr=null;
  setTimeout(()=>{ptrSuppress=false},50);
  if(!p.el) return;
  p.b.style.transition='transform .2s ease'; p.el.style.transition='transform .2s ease';
  if(p.d>=60){
    p.b.style.transform='translateY(52px)'; p.el.style.transform='translateY(8px)'; p.el.classList.add('spin'); tick();
    S.busy=true;
    setTimeout(()=>{ S.busy=false; p.b.style.transform=''; p.el.style.transform='translateY(-40px)';
      setTimeout(()=>{ S.keepScroll=false; render(); },200); }, 900);
  } else { p.b.style.transform=''; p.el.style.transform='translateY(-40px)'; setTimeout(()=>p.el.remove(),200); }
}
screenEl.addEventListener('touchstart',e=>ptrStart(e.touches[0].clientY/(parseFloat(document.getElementById('stage').style.getPropertyValue('--s'))||1), e.target),{passive:true});
screenEl.addEventListener('touchmove',e=>ptrMove(e.touches[0].clientY/(parseFloat(document.getElementById('stage').style.getPropertyValue('--s'))||1), e),{passive:false});
screenEl.addEventListener('touchend',ptrEnd); screenEl.addEventListener('touchcancel',ptrEnd);
let ptrMouse=false;
screenEl.addEventListener('mousedown',e=>{ ptrMouse=true; ptrStart(e.clientY/(parseFloat(document.getElementById('stage').style.getPropertyValue('--s'))||1), e.target); });
window.addEventListener('mousemove',e=>{ if(ptrMouse) ptrMove(e.clientY/(parseFloat(document.getElementById('stage').style.getPropertyValue('--s'))||1), e); });
window.addEventListener('mouseup',()=>{ if(ptrMouse){ ptrMouse=false; ptrEnd(); } });

/* ======================= events ======================= */
screenEl.addEventListener('click',e=>{
  if(ptrSuppress){ e.stopPropagation(); return; }
  const el=e.target.closest('[data-a]'); if(!el || el.disabled) return;
  e.stopPropagation(); Promise.resolve(act(el.dataset.a, el)).then(maybeFinish);
});
document.getElementById('navbar').addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(b && b.dataset.a==='back' && S.sheet && S.sheet.type!=='ready'){ S.sheet=null; render(); }});
document.querySelectorAll('.key.scan').forEach(k=>k.addEventListener('click',()=>{
  ac();
  if(S.busy) return;
  if(S.hl==='viewfinder' || (S.screen==='picking' && S.cam && !S.sheet)) { S.cam=true; doScan(); }
  else if(S.sheet && S.sheet.type==='subDetail' && S.sheet.q===0) act('sd-plus');
  else tick();
}));
function onNav(e){
  const st=e.target.closest('[data-step]'); if(st){ S._noScroll=true; go(+st.dataset.step); S._noScroll=false; return; }
  const nv=e.target.closest('[data-nav]'); if(!nv) return;
  if(nv.dataset.nav==='restart') go(1);
  else if(nv.dataset.nav==='prev') go(S.finished?12:S.step-1);
  else go(S.finished?12:S.step+1);
}
stepsEl.addEventListener('click',onNav); mcap.addEventListener('click',onNav);
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight') go(S.step+1); if(e.key==='ArrowLeft') go(S.step-1); });
const sbtn=document.getElementById('soundBtn');
sbtn.addEventListener('click',()=>{ soundOn=!soundOn; ac(); sbtn.textContent=soundOn?'🔊 Sound on':'🔇 Sound off'; sbtn.classList.toggle('off',!soundOn); if(soundOn) beepOK(); });

/* timer */
setInterval(()=>{ const t=document.getElementById('timer'); if(t && S.t0){ const ms=Date.now()-S.t0; t.textContent=fmt(ms); t.classList.toggle('late', ms>=90000); } },1000);

/* scale to fit */
function fit(){
  const st=document.getElementById('stage'); const w=st.offsetWidth, h=st.offsetHeight;
  const s=Math.min(innerWidth/w, innerHeight/h)*0.98; st.style.transform=`scale(${s})`; st.style.setProperty('--s',s);
}
addEventListener('resize',fit); fit();

go(1);
</script>
